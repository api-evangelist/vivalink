description: >-
  FinOps view of VivaLNK (Vivalink) spend. VivaLNK is a commercial,
  contact-sales connected-health vendor: cost is a blend of hardware
  (medical-grade wearable biosensors and disposable adhesives), the Biometrics
  Data Platform / cloud data services (scoped by subjects, devices, and data
  volume), and SDK / Developer Program licensing for API access. There is no
  public list price or self-service tier, so per-unit rates are not reconciled
  here. Dominant cost drivers are the number of monitored subjects, the number
  and type of deployed sensors, disposables consumed over time, and the volume
  of biometric data ingested, stored, and exported.
notes: >-
  Obtain quoted rates through VivaLNK's sales flow. For clinical-trial and RPM
  programs, disposables and per-subject platform fees typically dominate
  recurring cost; API/SDK licensing is governed by the Developer Program.
