meters:
- name: monitored_subjects
  description: Number of subjects (patients / participants) enrolled and monitored on the platform.
  unit: subjects
  aggregation: max
  dimensions:
  - account
  - project
- name: deployed_devices
  description: Number of VivaLNK wearable biosensors deployed, by type (ECG, temperature, SpO2, BP).
  unit: devices
  aggregation: max
  dimensions:
  - account
  - device_type
- name: disposables
  description: Disposable adhesives / consumables used with reusable sensors over time.
  unit: units
  aggregation: sum
  dimensions:
  - account
- name: data_volume
  description: Volume of biometric data ingested, stored, and exported through the platform.
  unit: bytes
  aggregation: sum
  dimensions:
  - account
  - project
principles:
- name: Visibility
  description: Track per-subject and per-device counts, disposable consumption, and data-volume ingested/exported against the account agreement.
- name: Allocation
  description: Scope subjects and devices to projects/studies so cost maps to programs, trials, or care lines.
- name: Optimization
  description: Right-size sensor mix and sampling to the clinical need; scope bulk exports and retention to what is required; reuse sensors with disposables to lower per-subject cost.
- name: Accountability
  description: Assign owners per project/study; review recurring platform and disposable spend against enrollment.
