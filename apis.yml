- aid: vivalink:vivalink-vital-signs-api
  name: VivaLNK Vital Signs Data API
  tags:
  - Vital Signs
  - ECG
  - Heart Rate
  - Temperature
  - SpO2
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.vivalink.com/vitals-data-services
  baseURL: https://api.vivalink.com
  properties:
  - url: https://www.vivalink.com/vitals-data-services
    type: Documentation
  - url: https://aws.amazon.com/blogs/apn/next-gen-patient-monitoring-with-vivalinks-intelligent-biometrics-platform-and-aws/
    type: Documentation
  - url: openapi/vivalink-openapi.yml
    type: OpenAPI
  - url: collections/vivalink.postman_collection.json
    type: PostmanCollection
  - url: collections/vivalink.opencollection.json
    type: OpenCollection
  description: >-
    Retrieve continuous and summary biometric measurements collected from
    subjects' wearables - ECG waveform, heart rate, heart rate variability,
    RR interval, respiratory rate, body/axillary temperature, SpO2, blood
    pressure, and accelerometer/activity data - as time-ranged time series or
    aggregated summaries, plus bulk data-file exports for retrospective
    analysis. Near-real-time access is served over REST (backed by Amazon
    Kinesis) rather than a public streaming socket. Endpoints are modeled from
    VivaLNK's documented cloud data services.
- aid: vivalink:vivalink-webhooks-api
  name: VivaLNK Webhooks API
  tags:
