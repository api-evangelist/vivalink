    type: OpenAPI
  - url: collections/vivalink.postman_collection.json
    type: PostmanCollection
  - url: collections/vivalink.opencollection.json
    type: OpenCollection
  description: >-
    Register webhook subscriptions so VivaLNK's platform pushes biometric data
    and alert events (for example threshold or arrhythmia notifications) to your
    HTTPS endpoint as they are produced - create, list, retrieve, update, and
    delete subscriptions. Webhook push is a documented VivaLNK Biometrics Data
    Platform capability; the endpoint shapes here are modeled.
