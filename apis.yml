aid: vivalink
url: https://raw.githubusercontent.com/api-evangelist/vivalink/refs/heads/main/apis.yml
name: VivaLNK
kind: company
description: >-
  VivaLNK (Vivalink) is a connected-health company providing medical-grade
  wearable biosensors and a Biometrics Data Platform for remote patient
  monitoring (RPM), hospital-at-home, and decentralized clinical trials. Its
  wearable sensors capture ECG, heart rate, heart rate variability, respiratory
  rate, RR interval, body/axillary temperature, SpO2, blood pressure, and
  three-axis accelerometer data. Mobile edge clients read the sensors over
  Bluetooth Low Energy (BLE) and deliver data to the cloud over RESTful HTTPS
  services (Amazon API Gateway plus Amazon Kinesis for near-real-time
  ingestion). The platform exposes machine-to-machine (M2M) cloud web-service
  APIs, webhook push, FHIR-based integration, and bulk data-file downloads for
  EHR, CTMS, and clinical-application integration. The developer surface is
  delivered through VivaLNK's SDK and Developer Program and is partner-gated;
  the full API reference is provided under license rather than published
  openly, so the endpoints described here are modeled from VivaLNK's documented
  platform capabilities.
